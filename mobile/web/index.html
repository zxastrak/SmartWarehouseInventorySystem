<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SUSUNO - Smart Warehouse Inventory System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SUSUNO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SUSUNO</title>
  <link rel="manifest" href="manifest.json">

  <!-- Style Splash Screen Web SUSUNO -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #02997a;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #loader_container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #02997a;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
      pointer-events: none;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 40px;
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .brand-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2.2px;
      color: #ffffff;
      line-height: 1.05;
    }

    .brand-subtitle {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 2.5px;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 5px;
      line-height: 1.3;
    }

    .loader-bar-wrap {
      width: 180px;
      height: 5px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background: #ffffff;
      border-radius: 999px;
      animation: indeterminate 1.4s ease-in-out infinite;
    }

    .loader-caption {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.85);
    }

    @keyframes indeterminate {
      0% {
        left: -45%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Splash Screen Awal Web SUSUNO -->
  <div id="loader_container">
    <div class="brand-wrap">
      <img src="susuno_logo.png" alt="SUSUNO" class="brand-logo" />
      <div class="brand-text">
        <span class="brand-title">SUSUNO</span>
        <span class="brand-subtitle">SMART WAREHOUSE<br>INVENTORY SYSTEM</span>
      </div>
    </div>
    <div class="loader-bar-wrap">
      <div class="loader-bar-fill"></div>
    </div>
    <div class="loader-caption">Memuat Sistem Inventaris...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
