name: susuno_mobile
description: SUSUNO staff mobile UI for PBL UAS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: 6.1.5+1
  mobile_scanner: 7.4.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/susuno_wordmark.png
    - assets/images/carton_menu.png
    - assets/images/susuno_logo.png
